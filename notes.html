<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>180-Day Discipline | Notes & Journal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">⚡ 180-DAY DISCIPLINE</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="tracker.html">Daily Tracker</a>
            <a href="notes.html" class="active">Notes & Journal</a>
        </div>
    </nav>

    <div class="container">
        <header class="page-header">
            <h1>📝 Deepsu's Notes & Reflection</h1>
            <p class="subtitle">Apne thoughts, daily learning, aur wins ko yahan note down karein.</p>
        </header>

        <div class="card">
            <h3 class="card-title">➕ Add New Note</h3>
            <div class="form-group">
                <input type="text" id="note-title" class="input-field" placeholder="Title (e.g. Day 1 Lesson...)">
                <textarea id="note-content" class="textarea-field" placeholder="Apna note yahan likhein..."></textarea>
                <button class="btn btn-blue" onclick="addNote()">Save Note 💾</button>
            </div>
        </div>

        <h2 class="section-heading" style="margin-top:30px;">📂 Your Saved Notes</h2>
        <div id="notes-container" class="notes-grid"></div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('discipline_saved_notes')) || [];

        function renderNotes() {
            const container = document.getElementById('notes-container');
            container.innerHTML = '';
            if (notes.length === 0) {
                container.innerHTML = '<p class="empty-msg">Koi note nahi hai. Upar add karein!</p>';
                return;
            }
            notes.forEach((note, index) => {
                const noteCard = document.createElement('div');
                noteCard.className = 'note-card';
                noteCard.innerHTML = `
                    <div class="note-header">
                        <h4>${note.title}</h4>
                        <span class="note-date">${note.date}</span>
                    </div>
                    <p class="note-body">${note.content}</p>
                    <button class="delete-btn" onclick="deleteNote(${index})">Delete 🗑️</button>
                `;
                container.appendChild(noteCard);
            });
        }

        function addNote() {
            const titleInput = document.getElementById('note-title');
            const contentInput = document.getElementById('note-content');

            if (!titleInput.value.trim() || !contentInput.value.trim()) return alert("Please details fill karein!");

            notes.unshift({
                title: titleInput.value.trim(),
                content: contentInput.value.trim(),
                date: new Date().toLocaleDateString('hi-IN')
            });

            localStorage.setItem('discipline_saved_notes', JSON.stringify(notes));
            titleInput.value = '';
            contentInput.value = '';
            renderNotes();
        }

        function deleteNote(index) {
            if (confirm("Delete karein?")) {
                notes.splice(index, 1);
                localStorage.setItem('discipline_saved_notes', JSON.stringify(notes));
                renderNotes();
            }
        }

        window.onload = renderNotes;
    </script>
</body>
</html>
